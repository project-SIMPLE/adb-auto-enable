name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0, v2.0, etc.
  workflow_dispatch: # Manual build, uploaded as a workflow artifact only

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history and tags, for git describe

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Get version name
        id: version
        run: |
          # On a tag this is the tag itself (v2.1.0 -> 2.1.0),
          # otherwise something like 2.1.0-3-gabc1234
          VERSION_NAME="$(git describe --tags --always)"
          echo "VERSION_NAME=${VERSION_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Lint and Build Release APK
        run: ./gradlew lintDebug assembleRelease -PversionName="${{ steps.version.outputs.VERSION_NAME }}" -PversionCode="$GITHUB_RUN_NUMBER"
        env:
          KEYSTORE_FILE: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: adbautoenable-${{ steps.version.outputs.VERSION_NAME }}-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
